<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分布式共享数据管理系统</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="logo-box">DS</div>
      <div>
        <div class="h-title">分布式共享数据管理系统</div>
        <div class="h-sub">DISTRIBUTED SHARED DATA MANAGEMENT SYSTEM v3.0</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="h-tag" style="color:#00e888;background:#00e88815;border:1px solid #00e88830">RDMA 跨节点</span>
      <span class="h-tag" style="color:#00d0f0;background:#00d0f015;border:1px solid #00d0f030">2 节点在线</span>
      <span id="clock" class="h-clock"></span>
    </div>
  </header>

  <!-- ===== BODY ===== -->
  <div class="app-body">

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-section-label">黑板</div>
      <div class="sidebar-btn sidebar-btn-disabled">① 对象总览</div>
      <div class="sidebar-btn sidebar-btn-disabled">② 对象生命周期管理</div>
      <div class="sidebar-btn sidebar-btn-disabled">④ 快照创建与恢复</div>
      <div class="sidebar-sep"></div>
      <div class="sidebar-section-label">网存算</div>
      <button class="sidebar-btn active" onclick="goPage('m3',this)">③ 跨节点同步</button>
      <button class="sidebar-btn" onclick="goPage('m5',this)">⑤ 系统吞吐量测试</button>
      <button class="sidebar-btn" onclick="goPage('m6',this)">⑥ 分级存储</button>
      <div class="sidebar-sep"></div>
      <div class="sidebar-info">
        native_rdma 分布式共享空间<br>
        2 节点 · A=primary · B=replica<br>
        RDMA: RoCEv2 (mlx5_0)<br>
        Control: TCP/18515 (OOB)<br>
        Data: RDMA WRITE+READ<br>
      </div>
    </nav>

    <!-- Main content area -->
    <div class="main-area">
      <div id="pg-m3" class="pg"></div>
      <div id="pg-m5" class="pg hidden"></div>
      <div id="pg-m6" class="pg hidden"></div>
    </div>

  </div>

  <!-- ===== SCRIPTS ===== -->
  <script>
    // 双节点部署配置
    //   ?a=host:port  覆盖节点 A 的 Flask 地址
    //   ?b=host:port  覆盖节点 B 的 Flask 地址
    // 未指定时：
    //   A = 当前页面所在 host:port（即提供 index.html 的那个 Flask）
    //   B = 同 host、端口 5001（本机双 Flask 场景）
    // 生产环境通常：
    //   http://nodeA:5000/?b=nodeB:5000
    (function () {
      const params = new URLSearchParams(location.search);
      const origin = location.origin;          // e.g. http://192.168.0.218:5000
      const defHost = location.hostname;
      const qA = params.get('a');
      const qB = params.get('b');
      window.API_BASE_A = qA
        ? (qA.startsWith('http') ? qA : 'http://' + qA)
        : origin;
      window.API_BASE_B = qB
        ? (qB.startsWith('http') ? qB : 'http://' + qB)
        : 'http://' + defHost + ':5001';
      window.API_BASE = window.API_BASE_A;
      window.getNodeAPI = function (node) {
        return node === 'A' ? window.API_BASE_A : window.API_BASE_B;
      };
      console.log('[dashboard] API_BASE_A =', window.API_BASE_A,
                  'API_BASE_B =', window.API_BASE_B);
    })();
  </script>
  <script src="utils.js"></script>
  <script src="m3_sync.js"></script>
  <script src="m5_perf.js"></script>
  <script src="m6_tiering.js"></script>
  <script>
    renderM3();
    renderM5();
    renderM6();
    tick();
  </script>
</body>

</html>
